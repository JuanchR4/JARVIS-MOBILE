<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS OS - Dual Robotics Industries</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glow: #00d4ff;
            --danger: #ff3c00;
            --bg: #000b0d;
            --glass: rgba(0, 212, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', sans-serif; cursor: none; }
        body { background: var(--bg); color: var(--glow); height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .bg-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px); background-size: 50px 50px; z-index: -1; animation: grid-move 20s linear infinite; }
        @keyframes grid-move { from { background-position: 0 0; } to { background-position: 50px 50px; } }

        .hud-frame { position: absolute; width: 95%; height: 95%; border: 1px solid rgba(0, 212, 255, 0.2); pointer-events: none; }
        
        .branding { font-family: 'Orbitron', sans-serif; letter-spacing: 5px; margin-bottom: 40px; text-shadow: 0 0 15px var(--glow); text-align: center; }

        .reactor-container { position: relative; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
        .reactor-outer { position: absolute; width: 100%; height: 100%; border: 2px dashed var(--glow); border-radius: 50%; animation: spin 10s linear infinite; opacity: 0.3; }
        
        .reactor { width: 200px; height: 200px; border-radius: 50%; border: 4px double var(--glow); box-shadow: 0 0 30px var(--glow), inset 0 0 30px var(--glow); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; z-index: 10; }
        .core { width: 70px; height: 70px; background: #fff; border-radius: 50%; box-shadow: 0 0 40px #fff, 0 0 60px var(--glow); transition: 0.3s; }
        
        .listening { border-color: var(--danger); box-shadow: 0 0 50px var(--danger), inset 0 0 30px var(--danger); transform: scale(1.05); }
        .listening .core { box-shadow: 0 0 40px #fff, 0 0 60px var(--danger); }

        .status-bar { position: absolute; bottom: 40px; width: 80%; display: flex; justify-content: space-between; font-size: 0.7rem; border-top: 1px solid rgba(0, 212, 255, 0.2); padding-top: 15px; }
        #console { font-family: 'Orbitron', sans-serif; color: #fff; font-size: 0.8rem; text-align: center; max-width: 80%; line-height: 1.5; text-shadow: 0 0 5px var(--glow); margin-top: 20px; min-height: 3em; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        #cursor { width: 20px; height: 20px; border: 1px solid var(--glow); position: fixed; pointer-events: none; border-radius: 50%; transform: translate(-50%, -50%); z-index: 999; }
    </style>
</head>
<body onclick="initJarvis()">
    <div class="bg-grid"></div>
    <div class="hud-frame"></div>
    <div id="cursor"></div>

    <div class="branding">
        <h2>JARVIS OS</h2>
        <p style="font-size: 0.6rem; opacity: 0.7;">DUAL ROBOTICS INDUSTRIES</p>
    </div>

    <div class="reactor-container">
        <div class="reactor-outer"></div>
        <div class="reactor" id="ring">
            <div class="core"></div>
        </div>
    </div>

    <div id="console">HAGA CLIC PARA ACTIVAR INTERFAZ NEURAL</div>

    <div class="status-bar">
        <span>ENLACE: ESTABLE</span>
        <span id="mainframe-status">MAINFRAME: CONECTADO</span>
        <span>SECURE: AES-256</span>
    </div>

    <script>
        const ring = document.getElementById('ring');
        const consoleLog = document.getElementById('console');
        const mainframeStatus = document.getElementById('mainframe-status');
        const synth = window.speechSynthesis;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isStarted = false;
        
        // Memoria local de aprendizaje actualizada
        const localMemory = [
            { keys: ["l293d", "l 293 d", "l-293d", "l293"], text: "El L293D soporta un voltaje máximo de alimentación de 36 voltios y una corriente de hasta 600 miliamperios por canal." },
            { keys: ["quién eres", "quien eres"], text: "Soy Jarvis, la interfaz de inteligencia artificial de Dual Robotics Industries." },
            { keys: ["hola"], text: "A su servicio, señor. ¿Qué protocolos iniciamos hoy?" },
            { keys: ["buenos días", "buenos dias"], text: "Buenos días, señor. Todos los sistemas operativos." }
        ];

        // Evita que una palabra genérica como “voltaje” dispare siempre una respuesta equivocada.
        function normalize(text) {
            return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
        }

        function findLocalAnswer(command) {
            const clean = normalize(command);
            for (const item of localMemory) {
                if (item.keys.some(key => clean.includes(normalize(key)))) return item.text;
            }
            return null;
        }

        // Memoria persistente: las respuestas aprendidas sobreviven al refresco.
        const learnedMemory = JSON.parse(localStorage.getItem("jarvisMemory") || "[]");
        function findLearnedAnswer(command) {
            const clean = normalize(command);
            const item = learnedMemory.find(x => clean.includes(normalize(x.key)));
            return item ? item.text : null;
        }
        function saveLearnedAnswer(question, answer) {
            const key = normalize(question).replace(/^(jarvis|oye jarvis)\s+/, "").slice(0, 100);
            if (!key || !answer) return;
            const old = learnedMemory.findIndex(x => x.key === key);
            if (old >= 0) learnedMemory[old] = { key, text: answer };
            else learnedMemory.unshift({ key, text: answer });
            localStorage.setItem("jarvisMemory", JSON.stringify(learnedMemory.slice(0, 100)));
        }

        async function searchInternet(question) {
            const query = encodeURIComponent(question.replace(/\bjarvis\b/gi, "").trim());
            const response = await fetch(`https://api.duckduckgo.com/?q=${query}&format=json&no_html=1&skip_disambig=1`, { signal: AbortSignal.timeout(8000) });
            if (!response.ok) throw new Error("search failed");
            const data = await response.json();
            let text = data.AbstractText || "";
            if (!text && Array.isArray(data.RelatedTopics)) {
                const topic = data.RelatedTopics.find(x => x.Text);
                if (topic) text = topic.Text;
            }
            if (text) return text.replace(/\s+/g, " ").trim();
            // Segundo intento: Wikipedia, que permite consultas desde una PWA.
            const wikiSearch = await fetch(`https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${query}&format=json&origin=*`, { signal: AbortSignal.timeout(8000) });
            if (!wikiSearch.ok) return null;
            const results = await wikiSearch.json();
            const title = results.query && results.query.search && results.query.search[0] && results.query.search[0].title;
            if (!title) return null;
            const summary = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`, { signal: AbortSignal.timeout(8000) });
            if (!summary.ok) return null;
            const page = await summary.json();
            return page.extract ? page.extract.replace(/\s+/g, " ").trim() : null;
        }

        async function consultMainframe(question) {
            mainframeStatus.innerText = "MAINFRAME: BUSCANDO EN INTERNET...";
            mainframeStatus.style.color = "#ffcc00";
            consoleLog.innerText = "MAINFRAME: CONSULTANDO...";
            try {
                const answer = await searchInternet(question);
                if (answer) {
                    const shortAnswer = answer.length > 600 ? answer.slice(0, 597) + "..." : answer;
                    saveLearnedAnswer(question, shortAnswer);
                    speak(shortAnswer + " He guardado este dato en mi memoria local.");
                    return;
                }
                speak("No encontré una respuesta confiable en la búsqueda. La pregunta queda pendiente para el mainframe.");
            } catch (error) {
                speak("No pude conectarme al buscador en este momento. La pregunta queda pendiente para el mainframe.");
            } finally {
                mainframeStatus.innerText = "MAINFRAME: CONECTADO";
                mainframeStatus.style.color = "var(--glow)";
            }
        }

        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function speak(text) {
            if (recognition) recognition.stop();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'es-ES';
            u.pitch = 0.9;
            u.rate = 1;
            
            u.onstart = () => {
                mainframeStatus.innerText = "MAINFRAME: TRANSMITIENDO";
                mainframeStatus.style.color = "#fff";
            };
            
            u.onend = () => {
                mainframeStatus.innerText = "MAINFRAME: CONECTADO";
                mainframeStatus.style.color = "var(--glow)";
                if (isStarted) setTimeout(startListening, 350);
            };
            
            synth.speak(u);
            consoleLog.innerText = "JARVIS: " + text;
        }

        function startListening() {
            try { recognition.start(); } catch(e) {}
        }

        function initJarvis() {
            if (isStarted) return;
            isStarted = true;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-CO';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                ring.classList.add('listening');
                consoleLog.innerText = "ESCUCHANDO...";
            };

            recognition.onend = () => {
                ring.classList.remove('listening');
            };

            recognition.onerror = (e) => {
                if (isStarted && e.error !== 'no-speech') {
                    setTimeout(startListening, 500);
                } else if (e.error === 'no-speech' && isStarted) {
                    startListening();
                }
            };

            recognition.onresult = (e) => {
                const cmd = e.results[0][0].transcript.toLowerCase();
                consoleLog.innerText = "USTED: " + cmd;

                const answer = findLocalAnswer(cmd) || findLearnedAnswer(cmd);
                if (answer) {
                    speak(answer);
                } else {
                    // Consulta automática: busca una respuesta y la guarda en memoria.
                    if (recognition) recognition.stop();
                    consultMainframe(cmd);
                }
            };

            speak("Sistemas cargados. Interfaz neural Dual Robotics activa.");
        }
    </script>
</body>
</html>
